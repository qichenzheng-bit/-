<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathPulse · 登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }
        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo i { font-size: 48px; color: #38bdf8; }
        .logo h1 { margin-top: 8px; font-size: 28px; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tabs { display: flex; gap: 0; margin-bottom: 24px; }
        .tab {
            flex: 1; text-align: center; padding: 10px; cursor: pointer;
            border-bottom: 2px solid transparent; transition: 0.2s;
            color: #94a3b8; font-weight: 500;
        }
        .tab.active { border-bottom-color: #38bdf8; color: #e2e8f0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        .form-group input {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); color: #f1f5f9;
            font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-group input:focus { border-color: #38bdf8; background: rgba(255,255,255,0.1); }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .checkbox-group input { width: auto; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
            background: linear-gradient(135deg, #38bdf8, #818cf8); color: #fff;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { color: #f87171; font-size: 13px; margin-top: 8px; display: none; }
        .api-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
        .api-section h3 { font-size: 14px; margin-bottom: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-square-root-alt"></i>
            <h1>MathPulse</h1>
        </div>
        <div class="tabs">
            <div class="tab active" id="login-tab">登录</div>
            <div class="tab" id="register-tab">注册</div>
        </div>
        <form id="auth-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <div id="register-extra" style="display:none;">
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirm-password" placeholder="请再次输入密码">
                </div>
            </div>
            <div class="checkbox-group" id="remember-group">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">记住密码</label>
            </div>
            <div class="api-section" id="api-section">
                <h3><i class="fas fa-key"></i> 豆包 API Key（可选，用于 AI 功能）</h3>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key" placeholder="以 ark- 开头">
                </div>
            </div>
            <button type="submit" class="btn" id="submit-btn">登 录</button>
            <div class="error-msg" id="error-msg"></div>
        </form>
    </div>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
